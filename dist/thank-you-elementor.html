<style>
/* PDD Home Services — landing
   Branding: dorado #C6983E · negro #000 · blanco #FFF
   Tipografía: Oswald (títulos) · Inter (texto) */

:root {
  --gold: #c7993f;
  --gold-dark: #a87d2a;
  --black: #000;
  --ink: #0d0d0d;
  --graphite: #1a1a1a;
  --white: #fff;
  --paper: #f6f3ec;
  --muted: #6b6b6b;
  --line: rgba(0, 0, 0, .12);
  --radius: 6px;
  --font-head: "Oswald", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --header-h: 76px;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--black); scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--white); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; line-height: 1.1; letter-spacing: .01em; text-transform: uppercase; margin: 0 0 .5em; }
h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }
h2 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); }
h3 { font-size: 1.35rem; }
p { margin: 0 0 1em; }

.container { width: min(1180px, 100% - 40px); margin-inline: auto; }

.eyebrow { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .18em; font-size: .85rem; color: var(--gold); margin-bottom: 1rem; font-weight: 500; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: .95rem 1.7rem; border-radius: var(--radius); font-family: var(--font-head); font-weight: 500; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; border: 2px solid transparent; cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn--gold { background: var(--gold); color: var(--black); }
.btn--gold:hover { background: var(--gold-dark); }
.btn--ghost { border-color: var(--white); color: var(--white); }
.btn--ghost:hover { background: var(--white); color: var(--black); }
.btn--dark { background: var(--black); color: var(--white); }
.btn--dark:hover { background: var(--graphite); }
.btn--outline-dark { border-color: var(--black); color: var(--black); }
.btn--outline-dark:hover { background: var(--black); color: var(--white); }
.btn--sm { padding: .65rem 1.2rem; font-size: .9rem; }
.btn--block { width: 100%; }

/* Header */
.header { position: sticky; top: 0; z-index: 50; background: var(--white); border-bottom: 2px solid var(--gold); box-shadow: 0 2px 14px rgba(0, 0, 0, .08); }
.header__inner { display: flex; align-items: center; gap: 1.5rem; min-height: var(--header-h); }
.header__logo img { height: 52px; width: auto; }
.header__nav { display: flex; gap: 1.6rem; margin-left: auto; }
.header__nav a { color: var(--ink); font-size: .92rem; font-weight: 500; }
.header__nav a:hover { color: var(--gold-dark); }
.header__phone { color: var(--ink); font-family: var(--font-head); font-size: 1.1rem; letter-spacing: .05em; }

/* Hero */
.hero { position: relative; background: var(--black); color: var(--white); padding: clamp(3rem, 7vw, 6rem) 0; overflow: hidden; isolation: isolate; }
.hero__bg { position: absolute; inset: 0; z-index: -1; background:
  radial-gradient(900px 500px at 85% 10%, rgba(198, 152, 62, .22), transparent 60%),
  linear-gradient(135deg, #000 0%, #161616 100%); background-size: cover; background-position: center; }
.hero__bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .72) 0%, rgba(0, 0, 0, .38) 55%, rgba(0, 0, 0, .12) 100%), linear-gradient(0deg, rgba(0, 0, 0, .35) 0%, transparent 35%); }
/* Slideshow with Ken Burns: 5 slides x 7s, cross-fading */
.hero__slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform-origin: center; will-change: transform, opacity; animation: heroKenBurns 35s linear infinite; animation-delay: calc(var(--i) * 7s - .5s); }
@keyframes heroKenBurns {
  0% { opacity: 0; transform: scale(1) translate(0, 0); }
  3% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; transform: scale(1.08) translate(-1%, -.6%); }
  100% { opacity: 0; transform: scale(1.08) translate(-1%, -.6%); }
}
.hero { min-height: min(88vh, 800px); display: flex; align-items: center; }
.hero__inner { display: block; }
.hero__copy { max-width: 46rem; }
.hero h1 span { color: var(--gold); }
.hero__lead { font-size: 1.15rem; max-width: 34em; color: rgba(255, 255, 255, .85); }
.hero__points { margin: 1.5rem 0 2rem; display: grid; gap: .6rem; }
.hero__points li { padding-left: 1.7rem; position: relative; color: rgba(255, 255, 255, .92); }
.hero__points li::before { content: ""; position: absolute; left: 0; top: .55em; width: .8rem; height: .8rem; background: var(--gold); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.hero__actions { display: flex; flex-wrap: wrap; gap: .9rem; }

/* Formulario */
.card { background: var(--white); color: var(--ink); border-radius: 10px; padding: clamp(1.5rem, 3vw, 2.2rem); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .55); border-top: 5px solid var(--gold); }
.form-card h2 { font-size: 1.7rem; margin-bottom: .3rem; }
.form-card > p { color: var(--muted); font-size: .95rem; }
.form { display: grid; gap: .9rem; }
.form label { display: grid; gap: .3rem; font-size: .85rem; font-weight: 500; }
.form input, .form select, .form textarea { font: inherit; padding: .75rem .85rem; border: 1px solid #cfcfcf; border-radius: var(--radius); background: var(--white); width: 100%; }
.form textarea { resize: vertical; }
.form__note { margin: 0; font-size: .85rem; min-height: 1.2em; text-align: center; color: var(--muted); }

/* Barra de confianza */
.trust { background: var(--gold); color: var(--black); }
.trust__grid { display: grid; grid-template-columns: repeat(4, 1fr); }
.trust__item { padding: 1.6rem 1rem; text-align: center; border-left: 1px solid rgba(0, 0, 0, .18); display: grid; gap: .1rem; }
.trust__item:first-child { border-left: 0; }
.trust__item strong { font-family: var(--font-head); font-size: 2.2rem; text-transform: uppercase; line-height: 1; font-weight: 600; }
.trust__item span { font-size: .9rem; font-weight: 500; }

/* Secciones */
.section { padding: clamp(3.5rem, 8vw, 6.5rem) 0; }
.section--dark { background: var(--black); color: var(--white); }
.section--alt { background: var(--paper); }
.section__head { max-width: 46rem; margin-bottom: 3rem; }
.section__head--center { margin-inline: auto; text-align: center; }
.section--dark .section__head p:not(.eyebrow) { color: rgba(255, 255, 255, .78); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 6vw, 5rem); align-items: center; }
.split--reverse .media { order: -1; }

/* Placeholders de imagen: al agregar la foto se reemplaza el fondo (ver main.js / README) */
.media { margin: 0; aspect-ratio: 4 / 3; border-radius: 10px; background: linear-gradient(135deg, #1a1a1a, #2b2b2b); background-size: cover; background-position: center; position: relative; overflow: hidden; border: 1px solid var(--line); }
.media:not(.has-image)::before { content: ""; position: absolute; inset: 14px; border: 2px dashed rgba(198, 152, 62, .6); border-radius: 6px; }
.media:not(.has-image)::after { content: "Foto: " attr(data-image); position: absolute; inset: 0; display: grid; place-items: center; color: var(--gold); font-family: var(--font-head); letter-spacing: .15em; text-transform: uppercase; font-size: .9rem; }

/* Projects */
.projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.project { aspect-ratio: 4 / 3; }
.project figcaption, .tile figcaption { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 2.2rem .9rem .8rem; color: var(--white); font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; background: linear-gradient(to top, rgba(0, 0, 0, .8), transparent); }
.project:not(.has-image) figcaption, .tile:not(.has-image) figcaption { background: none; }

/* About: three close-up tiles */
.mosaic { display: grid; grid-template-columns: 1.05fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; aspect-ratio: 4 / 3; }
.tile { aspect-ratio: auto; height: 100%; }
.tile--a { grid-row: 1 / 3; }

/* Servicios */
.services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(198, 152, 62, .35); border: 1px solid rgba(198, 152, 62, .35); }
.service { background: var(--black); padding: 2rem 1.6rem 2.2rem; transition: background .25s; }
.service:hover { background: #121212; }
.service__num { font-family: var(--font-head); color: var(--gold); font-size: 1rem; letter-spacing: .15em; display: block; margin-bottom: 2.5rem; }
.service h3 { color: var(--white); }
.service p { color: rgba(255, 255, 255, .72); font-size: .95rem; margin: 0; }

/* Process (materials photo as background) */
.process { position: relative; isolation: isolate; overflow: hidden; background: #0b0b0b; color: var(--white); }
.process__bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; }
.process__bg.has-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .68)); }
.process .steps p { color: rgba(255, 255, 255, .78); }

/* Pasos */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; counter-reset: s; }
.steps li { padding-top: 1.4rem; border-top: 3px solid var(--gold); }
.steps__num { font-family: var(--font-head); font-size: 3rem; line-height: 1; color: var(--gold); display: block; margin-bottom: .6rem; }
.steps p { color: var(--muted); font-size: .95rem; }

/* Checks */
.checks { display: grid; gap: .9rem; margin-top: 1.5rem; }
.checks li { padding-left: 2rem; position: relative; }
.checks li::before { content: ""; position: absolute; left: 0; top: .35em; width: 1.05rem; height: .6rem; border-left: 3px solid var(--gold); border-bottom: 3px solid var(--gold); transform: rotate(-45deg); }

/* Testimonios */
.testimonials { display: grid; justify-items: center; }
.testimonial { margin: 0; max-width: 46rem; text-align: center; padding: 2.5rem; border: 1px solid rgba(198, 152, 62, .45); border-radius: 10px; }
.stars { color: var(--gold); font-size: 1.4rem; letter-spacing: .25em; margin-bottom: 1rem; }
.testimonial blockquote { margin: 0 0 1.2rem; font-size: 1.2rem; line-height: 1.6; }
.testimonial figcaption { color: var(--gold); font-family: var(--font-head); letter-spacing: .12em; text-transform: uppercase; font-size: .9rem; }

/* FAQ */
.faq { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(2rem, 6vw, 5rem); align-items: start; }
.faq .section__head { margin: 0; }
.faq details { border-bottom: 1px solid var(--line); padding: 1.2rem 0; }
.faq summary { cursor: pointer; list-style: none; font-weight: 600; display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--font-head); font-size: 1.6rem; color: var(--gold); line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq details p { margin: .8rem 0 0; color: var(--muted); }

/* CTA final */

/* Footer */
.footer { position: relative; isolation: isolate; overflow: hidden; background: var(--black); color: rgba(255, 255, 255, .8); padding: 3rem 0 2rem; }
.footer__bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; }
.footer__bg.has-image::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .85); }
.footer__inner { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; }
.footer img { height: 50px; width: auto; }
.footer__contact { display: grid; gap: .3rem; justify-items: end; font-size: .95rem; }
.footer__contact a:hover { color: var(--gold); }
.footer__legal { grid-column: 1 / -1; margin: 1.5rem 0 0; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, .15); font-size: .82rem; opacity: .7; }

/* Responsive */
@media (max-width: 960px) {
  .hero__bg::after { background: linear-gradient(90deg, rgba(0, 0, 0, .88) 0%, rgba(0, 0, 0, .74) 55%, rgba(0, 0, 0, .42) 100%); }
  .header__nav, .header__phone { display: none; }
  .header .btn { margin-left: auto; }
  .hero__inner, .split, .faq { grid-template-columns: 1fr; }
  .split--reverse .media { order: 0; }
  .services, .steps { grid-template-columns: repeat(2, 1fr); }
  .trust__grid { grid-template-columns: repeat(2, 1fr); }
  .projects { grid-template-columns: 1fr; }
  .trust__item:nth-child(3) { border-left: 0; }
  .trust__item:nth-child(n+3) { border-top: 1px solid rgba(0, 0, 0, .18); }
}
@media (max-width: 560px) {
  .services, .steps { grid-template-columns: 1fr; }
  .header__logo img { height: 44px; }
  .footer__inner { grid-template-columns: 1fr; }
  .footer__contact { justify-items: start; }
  .hero__actions .btn, .cta__copy .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .hero__slide { animation: none; }
  .hero__slide:first-child { opacity: 1; }
  html { scroll-behavior: auto; }
  .btn { transition: none; }
}

/* Thank-you page: full viewport height, photo + dark/gold overlay so the logo stands out */
.thanks { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 20px; background: var(--black); color: var(--white); text-align: center; }
.thanks__bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; animation: thanksZoom 24s ease-in-out infinite alternate; }
.thanks::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 60% 55% at 50% 42%, rgba(199, 153, 63, .22), transparent 70%), linear-gradient(180deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .88)); }
.thanks__content { max-width: 36rem; display: grid; justify-items: center; gap: 1.2rem; }
.thanks__logo { width: min(280px, 70vw); height: auto; margin-bottom: 1rem; }
.thanks h2 { margin: 0; font-size: clamp(2.4rem, 6vw, 4rem); }
.thanks p { margin: 0 0 .8rem; font-size: 1.1rem; color: rgba(255, 255, 255, .85); }
@keyframes thanksZoom { from { transform: scale(1); } to { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .thanks__bg { animation: none; } }


/* Quote card: black, same height as the GoHighLevel form (the embed script sets the iframe height) */
.form-card { background: var(--black); color: var(--white); padding: clamp(1.5rem, 3vw, 2rem) 0 0; overflow: hidden; border-top: 5px solid var(--gold); }
.form-card h2, .form-card > p { padding-inline: clamp(1.25rem, 3vw, 2rem); }
.form-card h2 { color: var(--white); }
.form-card > p { color: rgba(255, 255, 255, .72); }
.form-embed { display: block; width: 100%; height: 640px; border: 0; margin: .5rem 0 0; background: var(--black); clip-path: inset(3px); } /* hides the white outline the GoHighLevel form draws around itself */

/* Gallery: one photo per row on phones (few photos, so they stay large) */
@media (max-width: 700px) {
  .projects { grid-template-columns: 1fr; }
}

/* Hero: more compact on desktop */
@media (min-width: 961px) {
  .hero { min-height: min(62vh, 540px); padding: 2.5rem 0; }
  .hero h1 { font-size: clamp(2.2rem, 3.8vw, 3.3rem); margin-bottom: .6rem; text-wrap: balance; max-width: 15em; }
  .hero h1 span { white-space: nowrap; }
  .hero .eyebrow { font-size: .78rem; margin-bottom: .7rem; }
  .hero__lead { font-size: 1rem; max-width: 36em; margin-bottom: .6rem; }
  .hero__points { margin: 1rem 0 1.4rem; gap: .35rem; font-size: .95rem; }
  .hero__actions .btn { padding: .8rem 1.4rem; font-size: .92rem; }
}

/* CTA: photo fading into the gold, form card overlapping the band below it */
.cta { background: var(--gold); color: var(--black); }
.cta__band { position: relative; isolation: isolate; overflow: hidden; padding: clamp(3.5rem, 6vw, 5rem) 0 clamp(7rem, 11vw, 9rem); }
.cta__photo { position: absolute; top: 0; right: 0; bottom: 0; width: 62%; z-index: -1; background-size: cover; background-position: center; -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 60%), linear-gradient(to bottom, #000 62%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0%, #000 60%), linear-gradient(to bottom, #000 62%, transparent 100%); mask-composite: intersect; }
.cta__copy { display: grid; gap: 1.4rem; justify-items: start; max-width: 32rem; }
.cta__copy h2, .cta__copy p { margin: 0; }
.cta__copy p { font-size: 1.05rem; }
.cta__points { display: grid; gap: .6rem; font-weight: 500; }
.cta__points li { padding-left: 1.6rem; position: relative; }
.cta__points li::before { content: ""; position: absolute; left: 0; top: .5em; width: .75rem; height: .75rem; background: var(--black); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.cta__formwrap { position: relative; z-index: 2; margin-top: clamp(-6.5rem, -9vw, -5rem); padding-bottom: clamp(3.5rem, 6vw, 5rem); }
.cta__formwrap .form-card { width: min(100%, 620px); margin-inline: auto; box-shadow: 0 30px 60px -22px rgba(0, 0, 0, .6); }
@media (max-width: 960px) {
  .cta__band { padding: 17rem 0 7rem; }
  .cta__photo { top: 0; bottom: auto; left: 0; width: 100%; height: 17rem; -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 100%); mask-image: linear-gradient(to bottom, #000 35%, transparent 100%); -webkit-mask-composite: source-over; mask-composite: add; }
}

</style>

  document.querySelectorAll("[data-image]").forEach(function (el) {
    var src = IMAGES[el.dataset.image];
    if (!src) return;
    var img = new Image();
    img.onload = function () {
      el.style.backgroundImage = 'url("' + src + '")';
      el.classList.add("has-image");
    };
    img.src = src;
  });

  // Third-party embeds (the GoHighLevel form script) can append in-flow elements after the footer,
  // which shows up as an empty band under it. Hide those; fixed/absolute widgets are left alone.
  const FOOTER_SELECTOR = ".footer";
  const IGNORED_TAGS = new Set(["SCRIPT", "STYLE", "LINK", "NOSCRIPT", "TEMPLATE"]);
  
  const hideStrayBlocks = () => {
    const footer = document.querySelector(FOOTER_SELECTOR);
    if (!footer) return;
    for (let el = footer.nextElementSibling; el; el = el.nextElementSibling) {
      if (IGNORED_TAGS.has(el.tagName)) continue;
      const position = getComputedStyle(el).position;
      if (position === "static" || position === "relative") el.style.setProperty("display", "none", "important");
    }
  };
  
  hideStrayBlocks();
  new MutationObserver(hideStrayBlocks).observe(document.body, { childList: true });
  
})();
